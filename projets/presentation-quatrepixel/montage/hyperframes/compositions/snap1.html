    .moi { --c: #0eadff; color: #0eadff; }
    .sn-ecrit { position: absolute; left: 0; bottom: 0; width: 1080px; height: 165px; }
    .sn-ecrit img { position: absolute; left: 60px; top: 38px; width: 96px; height: 96px; }

  <div id="root" data-composition-id="snap1" data-width="1080" data-height="1920">
    <div id="s1-ecran" class="sn-ecran clip" data-start="0" data-duration="3.3" data-track-index="0">
      <div class="sn-tete" data-layout-allow-overlap>
        <svg class="sn-retour" viewBox="0 0 44 70"><path d="M36 6 L8 35 L36 64" fill="none" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <div class="sn-vue">
        <div id="s1-pile" class="sn-pile">
          <div id="s1-l1" class="sn-label qp"><span>QUATREPIXEL</span></div>

          <div id="s1-m2" class="sn-ligne qp"><span style="color:#141414">Mets-le en story</span></div>
        </div>
        <div id="s1-ecrit" class="sn-ecrit">
          <img src="assets/snap/avatar.png" alt="" />
          <div class="sn-bulle">
            <div id="s1-p0" class="sn-point" style="left: 39px"></div>

        </div>
      </div>
      <div class="sn-champ"><div class="sn-ph">Envoyer un chat</div></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const ECRIT = 165, LABEL = 96, LIGNE = 90;
      // Pile ancrée en bas : y = hauteur des messages pas encore arrivés, moins la place de « en train d'écrire ».
      const arrive = (t, ids, y) => {
        tl.to("#s1-pile", { y: y, duration: 0.16, ease: "power2.out" }, t);
        ids.forEach((id) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out", immediateRender: false }, t));
      };
      const ecrit = (t0, t1, y) => {
        tl.to("#s1-pile", { y: y, duration: 0.16, ease: "power2.out" }, t0);
        tl.fromTo("#s1-ecrit", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, t0);
        tl.to("#s1-ecrit", { opacity: 0, duration: 0.08 }, t1 - 0.04);
        tl.set("#s1-etat-ecrit", { opacity: 1 }, t0).set("#s1-etat-instant", { opacity: 0 }, t0);
        tl.set("#s1-etat-ecrit", { opacity: 0 }, t1).set("#s1-etat-instant", { opacity: 1 }, t1);
        // Les 3 points pulsent l'un après l'autre.
        for (let t = t0, k = 0; t < t1 - 0.1; t += 0.13, k++) {
          const p = "#s1-p" + (k % 3);
          tl.to(p, { scale: 1.25, backgroundColor: "#55555b", duration: 0.13, ease: "sine.out" }, t);
          tl.to(p, { scale: 1, backgroundColor: "#9a9aa0", duration: 0.2, ease: "sine.in" }, t + 0.13);
        }
      };
      gsap.set("#s1-pile", { y: LABEL + 2 * LIGNE - ECRIT });
      ecrit(0, 0.8, LABEL + 2 * LIGNE - ECRIT);
      arrive(0.8, ["#s1-l1", "#s1-m1"], LIGNE);
      ecrit(1.6, 2.25, LIGNE - ECRIT);
      arrive(2.25, ["#s1-m2"], 0);
      tl.to({}, { duration: 0.01 }, 3.29);
      window.__timelines["snap1"] = tl;
    })();
  </script>
